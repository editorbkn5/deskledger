name: DeskLedger for Mac

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  package:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r packaging/macos/requirements.txt
      - run: bash scripts/build_macos.sh
      - name: Install from the disk image and verify the packaged runtime
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image=dist/DeskLedger-*-macOS-${{ matrix.arch }}.dmg
          mount=$(mktemp -d)
          installed="$RUNNER_TEMP/DeskLedger Install/DeskLedger.app"
          hdiutil attach $image -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" >/dev/null; rmdir "$mount"' EXIT
          mkdir -p "$(dirname "$installed")"
          ditto "$mount/DeskLedger.app" "$installed"
          codesign --verify --strict --deep "$installed"
          python scripts/smoke.py --native-core --storage "$installed/Contents/MacOS/deskledger-core"
          echo "DESKLEDGER_EXECUTABLE=$installed/Contents/MacOS/deskledger-core" >> "$GITHUB_ENV"
      - name: Launch the native AppKit window
        if: matrix.arch == 'arm64'
        run: python scripts/smoke.py --native-launcher "${{ runner.temp }}/DeskLedger Install/DeskLedger.app/Contents/MacOS/DeskLedger"
      - run: npx playwright install chromium webkit
        if: matrix.arch == 'arm64'
      - name: Run offline browser journeys in three languages
        if: matrix.arch == 'arm64'
        timeout-minutes: 6
        run: |
          BROWSER_ENGINE=chromium node --test tests/browser.cjs
          BROWSER_ENGINE=webkit node --test tests/browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: DeskLedger-macOS-${{ matrix.arch }}
          path: dist/DeskLedger-*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
