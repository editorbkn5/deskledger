name: DeskLedger CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node --test tests/browser.cjs
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py --windows
      - name: Run the embedded Windows runtime from the extracted ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/DeskLedger-*-Windows-x64.zip).FullName -DestinationPath 'dist/DeskLedger Smoke'
          python scripts/smoke.py 'dist/DeskLedger Smoke/DeskLedger.pyz' --python 'dist/DeskLedger Smoke/python/python.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: DeskLedger-Windows-x64
          path: dist/DeskLedger-*-Windows-x64.zip
